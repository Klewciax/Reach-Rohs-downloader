# Rejestr producentów.
#
# Pola:
#   name               – nazwa wyświetlana w raporcie
#   adapter            – nazwa adaptera (bom_compliance/adapters); "generic" = mechanizm awaryjny
#   domains            – OFICJALNE domeny producenta; pobieranie spoza nich jest zablokowane
#                        (dotyczy też przekierowań). Subdomeny są dozwolone automatycznie.
#   aliases            – warianty nazw spotykane w BoM (normalizacja usuwa wielkość liter,
#                        interpunkcję i formy prawne typu Inc./Ltd./GmbH)
#   compliance_pages   – strony producenta o RoHS/REACH (punkt startowy dla mechanizmu
#                        generycznego i lista "do ręcznego sprawdzenia" w raporcie)
#   contact_pages      – strony kontaktowe / formularze (raport "Do uzyskania mailowo")
#   search_urls        – opcjonalne szablony wyszukiwarki na stronie producenta, {mpn} = MPN
#   general_documents  – ogólne oświadczenia producenta (scope: general / family)
#   product_pages      – (opcja --lifecycle) szablony stron produktu; pola: {mpn} {mpn_lower} {base} {base_lower}
#                        ({base} = MPN bez sufiksu obudowy/opakowania, np. ATMEGA328P-AU -> ATMEGA328P)
#   longevity_pages    – (opcja --longevity) listy programów longevity / strony polityki EOL
#   longevity_documents– (opcja --longevity) PDF-y z programem longevity / polityką EOL
#
# ZASADA: wpisujemy wyłącznie URL-e znalezione na oficjalnej domenie producenta.
# Wszystkie URL-e z tego pliku są przy każdym uruchomieniu weryfikowane (HTTP 200,
# typ treści, domena); nieosiągalne są oznaczane w raporcie jako "do ręcznej weryfikacji".
# URL-e poniżej zostały zebrane 2026-10-01 z indeksu wyszukiwarki ograniczonego do
# oficjalnych domen producentów.

