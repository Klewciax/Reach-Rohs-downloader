# ==========================================================================================
#  Dane logowania do API dystrybutorów – WZÓR
# ==========================================================================================
#  1. Skopiuj ten plik jako  config/credentials.yaml
#        python -m bom_compliance.credentials init      (albo: cp credentials.example.yaml credentials.yaml)
#  2. Wpisz swoje klucze w config/credentials.yaml (puste pola = źródło nieużywane).
#  3. Sprawdź:  python -m bom_compliance.credentials status
#
#  config/credentials.yaml jest w .gitignore – NIE commituj go i nie wysyłaj nikomu.
#  Zmienne środowiskowe (np. DIGIKEY_CLIENT_ID) mają pierwszeństwo przed tym plikiem.
#
#  Do czego to służy: dystrybutorzy są ZAPASOWYM źródłem dokumentów RoHS/REACH (gdy strona
#  producenta nic nie dała) oraz pomagają wykryć stronę producentów spoza rejestru.
#  Wszystkie konta są bezpłatne (limity zapytań zależą od planu danego serwisu).
# ==========================================================================================

# ------------------------------------------------------------------------------------------
# DigiKey – NAJBARDZIEJ PRZYDATNE (zalecane)
#   Daje: dokumenty z sekcji "Environmental Information" (certyfikaty RoHS/REACH producentów),
#         status RoHS i REACH, status produktu (Active / Obsolete ...), link do karty katalogowej.
#   Rejestracja: https://developer.digikey.com/  -> utwórz organizację i aplikację produkcyjną
#                z dostępem do API "Product Information v4", skopiuj Client ID i Client Secret.
#   Uwierzytelnianie: OAuth2 client credentials (bez logowania użytkownika).
# ------------------------------------------------------------------------------------------
digikey:
  client_id: ""
  client_secret: ""

# ------------------------------------------------------------------------------------------
# Nexar / Octopart – BARDZO PRZYDATNE (zalecane)
#   Daje: oficjalną stronę producenta (najlepsza pomoc przy automatycznym wykrywaniu producentów
#         spoza rejestru), dokumenty części (także zgodności), najlepszą kartę katalogową.
#   Rejestracja: https://portal.nexar.com/  -> Create app, zakres (scope) "Supply",
#                zakładka Authorization: Client ID i Client Secret.
#   Uwaga: plan darmowy ma miesięczny limit liczby części – przy dużych BoM może się wyczerpać.
# ------------------------------------------------------------------------------------------
nexar:
  client_id: ""
  client_secret: ""

# ------------------------------------------------------------------------------------------
# Mouser – PRZYDATNE POMOCNICZO
#   Daje: status RoHS, status cyklu życia (np. "New Product", "End of Life"), link do karty
#         katalogowej. Mouser Search API NIE udostępnia dokumentów zgodności (plików).
#   Rejestracja: https://www.mouser.com/en/api-search/  -> "Search API", klucz przychodzi e-mailem.
# ------------------------------------------------------------------------------------------
mouser:
  api_key: ""

# ------------------------------------------------------------------------------------------
# TME – EKSPERYMENTALNE
#   Daje: dokumenty produktu (w tym deklaracje), producenta.
#   Rejestracja: konto klienta na tme.eu ("Aplikacje" w panelu) + konto deweloperskie
#                https://developers.tme.eu/ -> nowa aplikacja -> token (50 znaków) i sekret (20 znaków).
#   UWAGA: narzędzie używa starszej wersji TME API (podpis HMAC, api.tme.eu/....json), którą TME
#          oznacza jako przestarzałą na rzecz API v2 (OAuth2). Może przestać działać – wtedy
#          `python -m bom_compliance.credentials status --check` pokaże błąd.
# ------------------------------------------------------------------------------------------
tme:
  token: ""
  app_secret: ""
