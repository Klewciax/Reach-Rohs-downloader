# Domyślna konfiguracja bom-compliance. Skopiuj i zmodyfikuj, a następnie podaj przez --config.
output_dir: output

# Mapowanie kolumn BoM. Puste wartości = autodetekcja po typowych nazwach.
# Logiczne nazwy: mpn, manufacturer, refdes, quantity
columns: {}
#  mpn: "Mfr. Part #"
#  manufacturer: "Mfr."
#  refdes: "Designator"

sheet: null  # nazwa arkusza XLSX (null = pierwszy arkusz z rozpoznanym nagłówkiem)

# --- HTTP / uprzejmość wobec serwerów ---
connect_timeout: 10
read_timeout: 30
min_delay_per_host: 2.0   # s; jeśli robots.txt podaje Crawl-delay, używana jest większa wartość
delay_jitter: 0.5
max_retries: 4            # dla 429/5xx/błędów sieci; backoff wykładniczy + Retry-After
backoff_base: 2.0
backoff_max: 60
max_redirects: 5
max_download_mb: 50
respect_robots: true               # jawne zakazy Disallow w robots.txt są respektowane
robots_unreachable_policy: allow   # robots.txt nieosiągalny (timeout/5xx) -> "allow" (domyślnie) albo "disallow"
robots_timeout: 8                  # s; krótki timeout dla robots.txt
skip_dead_hosts: true              # host bez odpowiedzi jest pomijany do końca przebiegu (bez kolejnych timeoutów)
# user_agent: "..."                # domyślnie przeglądarkowy – część serwisów blokuje inne

# --- Logika wyszukiwania ---
fuzzy_manufacturer_match: true
fuzzy_cutoff: 0.88
download_general_statements: true   # pobieraj ogólne oświadczenia producenta jako materiał pomocniczy
count_general_as_success: false     # ogólne oświadczenie NIE jest traktowane jako deklaracja dla MPN
count_family_as_success: true       # dokument zbiorczy dla rodziny jest liczony (i oznaczany w raporcie)
generic_max_pages: 8
generic_max_depth: 2
max_docs_per_item: 6
pdf_text_pages: 6

# --- Dane do szablonu e-maila ---
requester_name: "[Your Name]"
requester_company: "[Your Company]"
requester_email: "[your.email@company.com]"
project_name: "[Product / Project name]"

# --- Status cyklu życia i długość produkcji (wyłączenie: --no-lifecycle / --no-longevity) ---
check_lifecycle: true             # status cyklu życia (Active / NRND / Last Time Buy / Obsolete) ze strony producenta
check_longevity: true             # program longevity producenta: czy MPN/rodzina jest objęta i do kiedy
request_longevity_by_email: true  # brak deklaracji "do kiedy" -> pozycja trafia na listę "Do uzyskania mailowo"
save_lifecycle_snapshots: true    # zapis kopii strony producenta, z której odczytano status (dowód)
download_longevity_documents: true  # pobieranie oficjalnych polityk EOL / longevity producenta (PDF)

# --- Analiza BoM / MPN ---
inspect_mpn: true               # sprawdź na stronie producenta, czy MPN jest pełnym numerem, czy skrótem
expand_abbreviated_mpn: true    # rozwiń skrót do pełnego numeru, gdy jest jednoznaczny (oznaczane w raporcie)
include_alternates: true        # przetwarzaj zamienniki z kolumn "Manufacturer 2 / MPN 2", "Alt MPN" itp.

# --- Dystrybutorzy jako zapasowe źródło + wykrywanie producentów spoza rejestru ---
distributor_fallback: true        # brak dokumentu na stronie producenta -> Octopart/Nexar, DigiKey, Mouser, TME (API)
distributor_sources: [nexar, digikey, mouser, tme]
distributor_lookup_always: false  # true = pobieraj statusy RoHS/REACH/cyklu życia od dystrybutorów dla każdej pozycji
auto_discover_manufacturers: true # producent spoza rejestru -> automatyczne wykrycie i weryfikacja jego strony
# Klucze API: wpisz je w config/credentials.yaml (utwórz: python -m bom_compliance.credentials init).
# Zmienne środowiskowe (DIGIKEY_CLIENT_ID itd.) mają pierwszeństwo przed plikiem.
# credentials_file: config/credentials.yaml
