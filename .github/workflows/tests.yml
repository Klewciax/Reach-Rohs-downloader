name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Uruchom smoke test LIVE (prawdziwe strony producentów)"
        type: boolean
        default: false

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Smoke test (offline)
        run: python -m bom_compliance.smoke
      - name: Unit + smoke tests
        run: python -m pytest -q

  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Smoke test (live)
        run: python -m bom_compliance.smoke --live --lifecycle --longevity
